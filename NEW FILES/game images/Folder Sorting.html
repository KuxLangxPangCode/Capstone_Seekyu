<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Seekyu · Document Sorting </title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --pri:#7367f0;
      --pri-dark:#5f55d3;
      --ink:#434968;
      --panel-top:#efedff;
      --panel-bot:#fafaff;
    }

    /* Pixel look (match client-guard) */
    .pixel-ui { font-family: "Press Start 2P", system-ui, sans-serif; }
    .pixel-title { font-size: 10px; color: var(--ink); }
    .pixel-label { font-size: 10px; color: var(--ink); }
    .pixel-panel {
      background: linear-gradient(180deg, var(--panel-top) 0%, var(--panel-bot) 100%);
      border: 4px solid var(--pri);
      outline: 2px solid var(--ink);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 6px 0 var(--pri);
    }

    /* Buttons */
    .pixel-btn {
      background: var(--pri);
      border: 4px solid var(--ink);
      outline: 2px solid #dfddff;
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 10px;
      line-height: 1;
      transition: transform .05s, background .2s;
    }
    .pixel-btn:hover{ background: var(--pri-dark); transform: translateY(-1px); }
    .pixel-btn:active{ transform: translateY(1px); }

    /* Pills */
    .pill{
      font-size:10px; padding:3px 7px; border-radius:999px;
      border:2px solid rgba(0,0,0,.08); background:#fff; color:var(--ink);
      display:inline-flex; align-items:center; gap:6px; white-space:nowrap; max-width:100%;
      overflow:hidden; text-overflow:ellipsis;
    }
    .pill-ok{ background:#ecfdf5; color:#065f46; border-color:#10b981; }
    .pill-warn{ background:#fff7ed; color:#9a3412; border-color:#fb923c; }
    .pill-err{ background:#fee2e2; color:#991b1b; border-color:#fca5a5; }
    .pill-soft{ background:#f3f4f6; }

    .mono{ font-variant-numeric: tabular-nums; }

    /* Stage */
    .stage{ position:relative; height:520px; background:linear-gradient(180deg,#efeefe 0%,#f9f8ff 100%); border:3px solid #c9c3ff; outline:2px solid var(--pri); border-radius:14px; overflow:hidden; }

    /* Stacked paper (image only, no border) */
    .doc{
      position:absolute;
      width:280px;
      user-select:none;
      cursor:grab;
      opacity:0;
      transform: translate(-50%,-50%) scale(.96);
      transition:
        left .35s cubic-bezier(.2,.7,.2,1),
        top  .35s cubic-bezier(.2,.7,.2,1),
        opacity .25s ease,
        transform .12s ease;
      image-rendering:auto;
      background:transparent;
      padding:0;
      border-radius:0;
      box-shadow:none;
      z-index:1;
    }
    .doc.ready{ opacity:1; transform: translate(-50%,-50%) scale(1); }
    .doc:active{ cursor:grabbing; }
    .doc.locked{ filter:grayscale(10%) opacity(.85); }

    @media (max-width:520px){ .doc{ width:240px; } }

    /* Folders */
    .folders{
      position:absolute; left:0; right:0; bottom:10px;
      display:grid; grid-template-columns:repeat(3,1fr); gap:12px;
      padding:10px; pointer-events:none;
    }
    .folder{
      pointer-events:auto;
      background:#fff; border:3px solid #e3e1ff; outline:2px solid #f3f2ff; border-radius:12px;
      min-height:120px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:6px;
      padding:10px 10px 12px;
    }
    .folder img{ width:48px; height:48px; image-rendering:pixelated; }
    .folder .label{ font-size:10px; color:var(--ink); text-align:center; }
    .folder.drop-focus{ outline-color:var(--pri); box-shadow: inset 0 0 0 2px var(--pri); background:#f1efff; }
    .folder-grid{ width:100%; display:grid; grid-template-columns:repeat(auto-fill,minmax(44px,1fr)); gap:6px; }

    .in-bin{
      position:static !important; width:44px !important; height:44px !important;
      padding:0 !important; border-radius:6px; border:2px solid #c9c3ff; background:#fff;
      transform:none !important; cursor:default;
    }

    /* HUD */
    .hud{ display:flex; align-items:center; gap:16px; color:var(--ink); }
    .pill-float{
      position:absolute; top:10px; right:10px; z-index:50;
      pointer-events:none; opacity:0; transform:translateY(-6px);
      transition: opacity .2s, transform .2s;
    }
    .pill-float.show{ opacity:1; transform:translateY(0); }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 font-[Inter]">
  <!-- Header -->
  <header class="border-b border-slate-200 bg-white">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="h-8 w-8 rounded-lg text-white grid place-items-center font-bold bg-[#7367f0]">S</div>
        <div class="text-sm font-semibold tracking-tight" style="color:#434968">Seekyu · Assessment</div>
      </div>
      <div class="text-xs" style="color:#434968">Scenario: Document Sorting</div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <!-- Instruction -->
    <section class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
      <h1 class="text-lg md:text-xl font-semibold tracking-tight" style="color:#434968">Instruction</h1>
      <p class="mt-1 text-[15px] leading-6" style="color:#434968">
        Drop each document into the correct folder:
        <em>Incidents</em>, <em>Applications</em>, or <em>Leave Requests</em>.
      </p>

      <div class="mt-4 flex items-center justify-between">
        <p class="text-xs" style="color:#434968">Click Start to reveal desk.</p>
        <button id="beginBtn" type="button" class="pixel-btn">Start</button>
      </div>
    </section>

    <!-- Game Panel -->
    <section class="mt-6 pixel-panel pixel-ui">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <h2 class="pixel-title font-bold">DOCUMENT SORTING</h2>
        <div class="hud">
          <span class="pixel-label">Time: <span id="pixelTimer" class="mono">00:00</span></span>
          <span id="statusLabel" class="pixel-label">Filed: 0/0</span>
        </div>
      </div>

      <div id="stage" class="stage mt-4">
        <div id="feedbackPill" class="pill pill-float"></div>
        <div id="foldersRow" class="folders hidden"></div>
      </div>

      <div class="mt-4 flex items-center gap-3">
        <button id="submitBtn" class="pixel-btn hidden">SUBMIT</button>
        <button id="nextBtn" class="pixel-btn hidden" style="background:#10b981;border-color:#047857;outline-color:#a7f3d0;">NEXT</button>
      </div>
    </section>

    <!-- Outcome -->
    <section id="outcome" class="hidden mt-6 bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
      <div class="flex items-center gap-2">
        <div id="outcomeDot" class="h-2.5 w-2.5 rounded-full bg-slate-300"></div>
        <h3 class="text-base font-semibold" style="color:#434968">Result</h3>
      </div>
      <p id="outcomeText" class="mt-2 text-sm" style="color:#434968"></p>

      <details class="mt-3">
        <summary class="text-sm cursor-pointer" style="color:#434968">View breakdown</summary>
        <div id="breakdown" class="mt-2 text-sm space-y-2" style="color:#434968"></div>
      </details>
    </section>
  </main>

  <script>
    /* ---------- CONFIG ---------- */
    const POINTS_PER_CORRECT = 10;

    const DOCS_SRC = [
      { id:'ir1', kind:'incident',    label:'Incident Report',  src:'images/incident1.png' },
      { id:'ir2', kind:'incident',    label:'Incident Report',  src:'images/incident2.png' },
      { id:'ap1', kind:'application', label:'Applicant Form',   src:'images/application1.png' },
      { id:'ap2', kind:'application', label:'Applicant Form',   src:'images/application2.png' },
      { id:'lv1', kind:'leave',       label:'Leave Request',    src:'images/leave1.png' },
      { id:'lv2', kind:'leave',       label:'Leave Request',    src:'images/leave2.png' }
    ];

    const FOLDERS = [
      { kind:'incident',    label:'Incidents',       icon:'images/folder.png' },
      { kind:'application', label:'Applications',    icon:'images/folder.png' },
      { kind:'leave',       label:'Leave Requests',  icon:'images/folder.png' }
    ];

    /* ---------- ELMS ---------- */
    const beginBtn = document.getElementById('beginBtn');
    const pixelTimer = document.getElementById('pixelTimer');
    const statusLabel = document.getElementById('statusLabel');
    const stage = document.getElementById('stage');
    const foldersRow = document.getElementById('foldersRow');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const outcome = document.getElementById('outcome');
    const outcomeDot = document.getElementById('outcomeDot');
    const outcomeText = document.getElementById('outcomeText');
    const breakdown = document.getElementById('breakdown');
    const feedbackPill = document.getElementById('feedbackPill');

    /* ---------- TIMER ---------- */
    let timerHandle=null, secondsElapsed=0;
    function startTimer(){
      clearInterval(timerHandle); secondsElapsed=0;
      timerHandle=setInterval(()=>{
        secondsElapsed++;
        const mm=String(Math.floor(secondsElapsed/60)).padStart(2,'0');
        const ss=String(secondsElapsed%60).padStart(2,'0');
        pixelTimer.textContent=`${mm}:${ss}`;
      },1000);
    }
    function stopTimer(){ clearInterval(timerHandle); }

    /* ---------- STATE ---------- */
    let DOCS=[], docEls=[], topIndex=0, finished=false;
    const placed = new Map();

    /* ---------- HELPERS ---------- */
    const shuffle = (a)=>{ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

    function setDraggableStates(){
      docEls.forEach((el,i)=>{
        const active = i===topIndex && !el.classList.contains('in-bin');
        el.draggable = active;
        el.classList.toggle('locked', !active);
      });
    }

    function recenterStack(){
      if(!docEls.length) return;
      const rect = stage.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height * 0.33; // a bit higher
      docEls.forEach((el,i)=>{
        if (el.classList.contains('in-bin')) return;
        el.style.left = `${cx}px`;
        el.style.top  = `${cy + (i*2)}px`;
      });
    }

    function updateStatus(){
      statusLabel.textContent = `Filed: ${placed.size}/${DOCS.length}`;
      submitBtn.classList.toggle('hidden', placed.size < DOCS.length || finished);
    }

    function showToast(text, cls='pill-ok'){
      feedbackPill.className = `pill pill-float ${cls}`;
      feedbackPill.textContent = text;
      feedbackPill.classList.add('show');
      setTimeout(()=> feedbackPill.classList.remove('show'), 1400);
    }

    /* ---------- FOLDERS ---------- */
    function renderFolders(){
      foldersRow.innerHTML = '';
      FOLDERS.forEach(f=>{
        const bin = document.createElement('div');
        bin.className = 'folder';
        bin.dataset.kind = f.kind;
        bin.innerHTML = `
          <img src="${f.icon}" alt="${f.label}" draggable="false"/>
          <div class="label pixel-ui">${f.label}</div>
          <div class="folder-grid" aria-label="${f.label} dropzone"></div>
        `;
        bin.addEventListener('dragover', e=>{ if(!finished){ e.preventDefault(); bin.classList.add('drop-focus'); } });
        bin.addEventListener('dragleave', ()=> bin.classList.remove('drop-focus'));
        bin.addEventListener('drop', e=>{
          if (finished) return;
          e.preventDefault();
          bin.classList.remove('drop-focus');
          const id = e.dataTransfer.getData('id');
          const el = document.getElementById(id);
          if (!el) return;

          // move to bin grid
          el.classList.add('in-bin');
          el.style.left = '0px'; el.style.top = '0px';
          bin.querySelector('.folder-grid').appendChild(el);

          // scoring per-drop
          const doc = DOCS.find(d=>d.id===id);
          const correct = (bin.dataset.kind === doc.kind);
          placed.set(id, bin.dataset.kind);

          showToast(correct ? `✓ Correct: ${doc.label}` : `✗ Wrong — should be ${prettyKind(doc.kind)}`, correct?'pill-ok':'pill-err');

          // next sheet
          topIndex = Math.max(-1, topIndex-1);
          setDraggableStates();
          updateStatus();
        });
        foldersRow.appendChild(bin);
      });
    }

    function prettyKind(k){
      if(k==='incident') return 'Incidents';
      if(k==='application') return 'Applications';
      if(k==='leave') return 'Leave Requests';
      return k;
    }

    /* ---------- DOCS ---------- */
    function spawnDocs(){
      const rect = stage.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height * 0.33;

      docEls = [];
      DOCS.forEach((d,i)=>{
        const el = document.createElement('img');
        el.id = d.id;
        el.src = d.src;
        el.alt = d.label;
        el.className = 'doc';
        el.dataset.kind = d.kind;

        el.style.left = `${cx}px`;
        el.style.top  = `${cy + (i*2)}px`;
        el.style.zIndex = 10 + i;
        stage.appendChild(el);
        docEls.push(el);

        el.addEventListener('dragstart', e=>{
          if (docEls.indexOf(el) !== topIndex || el.classList.contains('in-bin')) { e.preventDefault(); return; }
          e.dataTransfer.setData('id', d.id);
        });

        requestAnimationFrame(()=> el.classList.add('ready'));
      });

      topIndex = docEls.length - 1;
      setDraggableStates();

      window.addEventListener('resize', recenterStack);
      new ResizeObserver(recenterStack).observe(stage);
    }

    /* ---------- END / SCORING ---------- */
    function scoreIt(){
      const correct = DOCS.filter(d => placed.get(d.id) === d.kind).length;
      const wrong = DOCS.length - correct;
      const points = correct * POINTS_PER_CORRECT;
      return { correct, wrong, points };
    }

    function finalize(){
      finished = true;
      stopTimer();

      const { correct, wrong, points } = scoreIt();
      const total = DOCS.length;

      // outcome
      const pct = Math.round((correct/total)*100);
      let verdict='Fail', color='bg-rose-500';
      if(pct>=75){ verdict='Pass'; color='bg-emerald-500'; }
      else if(pct>=60){ verdict='Conditional'; color='bg-amber-500'; }
      outcomeDot.className = `h-2.5 w-2.5 rounded-full ${color}`;
      outcomeText.textContent = `${verdict}: ${correct}/${total} (${pct}%) • Wrong: ${wrong} • Points: ${points} • Time: ${pixelTimer.textContent}`;
      outcome.classList.remove('hidden');

      // breakdown
      breakdown.innerHTML = '';
      DOCS.forEach(d=>{
        const picked = placed.get(d.id);
        const ok = picked === d.kind;
        const row = document.createElement('div');
        row.innerHTML = ok
          ? `✓ <strong>${d.label}</strong> → ${prettyKind(picked)}`
          : `✗ <strong>${d.label}</strong> → ${prettyKind(picked||'None')} <span class="ml-1 opacity-70">(should be ${prettyKind(d.kind)})</span>`;
        row.style.color = ok ? '#065f46' : '#991b1b';
        breakdown.appendChild(row);
      });

      submitBtn.classList.add('hidden');
      nextBtn.classList.remove('hidden');
      nextBtn.onclick = ()=> console.log('NEXT clicked');
      showToast('Submitted', 'pill-warn');
    }

    /* ---------- CONTROLS ---------- */
    beginBtn.addEventListener('click', ()=>{
      // reset
      placed.clear();
      stage.querySelectorAll('.doc').forEach(n=>n.remove());
      outcome.classList.add('hidden');
      finished=false;

      // show bins + randomize + start
      foldersRow.classList.remove('hidden');
      DOCS = shuffle(DOCS_SRC);
      renderFolders();
      spawnDocs();
      updateStatus();
      startTimer();

      beginBtn.disabled = true;
      beginBtn.classList.add('opacity-60','cursor-not-allowed');
    });

    submitBtn.addEventListener('click', ()=>{
      if(finished) return;
      if(placed.size < DOCS.length){
        showToast(`Please file all ${DOCS.length} papers`, 'pill-warn');
        return;
      }
      finalize();
    });

    // Submit
    const mo = new MutationObserver(()=> {
      if(placed.size === DOCS.length && !finished) submitBtn.classList.remove('hidden');
    });
    mo.observe(stage, { childList:true, subtree:true });
  </script>
</body>
</html>
